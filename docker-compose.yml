services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: laravel_app

    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - storage_data:/var/www/html/storage

    depends_on:
      - postgres
      - redis

    networks:
      - laravel

  postgres:
    image: postgres:16

    container_name: postgres_db

    restart: unless-stopped

    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - laravel

  redis:
    image: redis:7

    container_name: laravel_redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    networks:
      - laravel

volumes:
  postgres_data:
  vendor_data:
  storage_data:

networks:
  laravel: